name: frontend-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: npm ci || npm install
      - run: npm run type-check
      - run: npm run build

      - name: File size check (max 500 lines)
        run: |
          FAIL=0
          for f in $(find web/src -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.css" \)); do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 500 ]; then
              echo "TOO BIG ($lines): $f"
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 1 ]; then exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
