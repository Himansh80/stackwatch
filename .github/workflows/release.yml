name: StackWatch release (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver tag, e.g. v1.0.0
        required: true
        type: string
      release_notes:
        description: Release notes (markdown)
        required: false
        type: string
        default: "Automated release"

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Install deps
        run: go mod download

      - name: Test everything
        run: go test ./... -count=1 -timeout=120s

      - name: Build all binaries for release
        run: |
          VERSION="${{ github.event.inputs.version }}"
          mkdir -p bin/release/$VERSION
          for svc in api-gateway agent web-terminal truenas-connector; do
            for os in linux darwin windows; do
              for arch in amd64 arm64; do
                out="bin/release/$VERSION/stackwatch-$svc-$os-$arch"
                [ "$os" = "windows" ] && out="$out.exe"
                CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
                  go build -ldflags="-s -w -X main.version=$VERSION" \
                  -o "$out" ./cmd/$svc
              done
            done
          done
          sha256sum bin/release/$VERSION/* > bin/release/$VERSION/SHA256SUMS.txt

      - name: Package release
        run: |
          cd bin/release/${{ github.event.inputs.version }}
          tar -czf stackwatch-${{ github.event.inputs.version }}-linux-amd64.tar.gz stackwatch-*-linux-amd64*
          tar -czf stackwatch-${{ github.event.inputs.version }}-linux-arm64.tar.gz stackwatch-*-linux-arm64*
          zip -q stackwatch-${{ github.event.inputs.version }}-windows-amd64.zip stackwatch-*-windows-amd64*.exe

      - name: Tag the release
        run: |
          git config user.name "stackwatch-bot"
          git config user.email "bot@stackwatch.dev"
          git tag -a "${{ github.event.inputs.version }}" -m "StackWatch ${{ github.event.inputs.version }}"
          git push origin "${{ github.event.inputs.version }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: StackWatch ${{ github.event.inputs.version }}
          body: |
            StackWatch ${{ github.event.inputs.version }}
            Automated release.
            
            ## Artifacts
            - `stackwatch-*-linux-amd64.tar.gz` — Linux binaries (x86_64)
            - `stackwatch-*-linux-arm64.tar.gz` — Linux ARM64
            - `stackwatch-*-windows-amd64.zip` — Windows x86_64
          files: bin/release/${{ github.event.inputs.version }}/stackwatch-*
          draft: false
          prerelease: false
